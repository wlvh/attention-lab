<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" aria-labelledby="title desc">
  <title id="title">图 6-1｜本层读出先改变，下一层的 Q 才开始不同</title>
  <desc id="desc">图 6-1。两种方法处理相同输入token，各自维护缓存。保存的首个答案预测位置上，前13层完整计算使第14层输入与Q相同。第14层A读取全部K/V，D-one读取入选K/V，其注意力读出已有差异。经过输出投影、残差、MLP后，第15层输入与Q出现差异。新读出不会倒流修改已计算的本层K/V。此图描述保存记录的层间顺序，不定位具体错误或信息中转位置。</desc>
  <metadata>Source: src/attention_lab/inference.py::StepCapture,state_difference; bench/g3c_diagnostics.py; reports/g3c_summary_mac_m4max.json. Static teaching schematic. No new model run. Box sizes do not encode time, token count, or vector size.</metadata>
  <defs>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #14243a; }
      .title { font-size:32px; font-weight:650; }
      .heading { font-size:26px; font-weight:650; }
      .body { font-size:22px; }
      .small { font-size:20px; }
      .note { font-size:20px; fill:#475569; }
      .strong { font-weight:650; }
      .center { text-anchor:middle; }
      .teal { fill:#0f766e; }
      .violet { fill:#6d28d9; }
      .blue { fill:#1d4ed8; }
      .amber { fill:#92400e; }
      .line { fill:none; stroke:#64748b; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
      .arrow { marker-end:url(#arrow); }
      .gradient { fill:none; stroke:#b45309; stroke-width:3; stroke-dasharray:8 6; marker-end:url(#gradient-arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
    <marker id="gradient-arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
  </defs>
  <rect width="1440" height="1110" rx="20" fill="#fff"/>
<text x="38" y="52" class="title" >图 6-1｜本层读出先改变，下一层的 Q 才开始不同</text>
<text x="40" y="91" class="note" >A：所有层完整读取 · D-one：只有第 14 层使用训练后的稀疏读取，其余层完整读取</text>
<rect x="130" y="125" width="1180" height="70" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
<text x="720.0" y="168.0" class="small center" >两边输入同一串 token，各自维护缓存；图中取问题和模板处理完、预测首个答案的那一步。</text>
<rect x="290" y="235" width="860" height="72" rx="12" fill="#e7f6f1" stroke="#7dc8b4" stroke-width="1.5" />
<text x="720.0" y="279.0" class="body center" >第 1—13 层都完整读取 → 到第 14 层时，本步输入表示相同</text>
<path d="M500 308 V327 H60 V443 H79" class="line arrow"/>
<path d="M940 308 V327 H1380 V443 H1369" class="line arrow"/>
<text x="365" y="370" class="heading center teal" >A · 完整读取</text>
<text x="1075" y="370" class="heading center violet" >D-one · 仅第 14 层少读</text>
<rect x="80" y="405" width="570" height="78" rx="12" fill="#e7f6f1" stroke="#7dc8b4" stroke-width="1.5" />
<text x="365.0" y="452.0" class="body center" >由本步输入先计算第 14 层 Q / K / V</text>
<rect x="790" y="405" width="570" height="78" rx="12" fill="#f2ecff" stroke="#bba1e7" stroke-width="1.5" />
<text x="1075.0" y="452.0" class="body center" >由本步输入先计算第 14 层 Q / K / V</text>
<path d="M651 443 H780" class="line"/>
<text x="720" y="424" class="small center strong" >Q 相同</text>
<path d="M365 484 V532" class="line arrow"/>
<path d="M1075 484 V532" class="line arrow"/>
<rect x="80" y="542" width="570" height="104" rx="12" fill="#e7f6f1" stroke="#7dc8b4" stroke-width="1.5" />
<text x="365.0" y="586.5" class="body center" >Q 读取全部合法位置的 K / V</text>
<text x="365.0" y="617.5" class="body center" >得到本层注意力读出 o_A</text>
<rect x="790" y="542" width="570" height="104" rx="12" fill="#f2ecff" stroke="#bba1e7" stroke-width="1.5" />
<text x="1075.0" y="586.5" class="body center" >相同 Q 只读取入选位置的 K / V</text>
<text x="1075.0" y="617.5" class="body center" >得到本层注意力读出 o_D-one</text>
<text x="720" y="581" class="small center amber strong" >已不同</text>
<path d="M651 605 H780" class="line"/>
<path d="M365 647 V695" class="line arrow"/>
<path d="M1075 647 V695" class="line arrow"/>
<rect x="80" y="705" width="570" height="74" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
<text x="365.0" y="750.0" class="body center" >原 o_proj → 残差、归一化与 MLP</text>
<rect x="790" y="705" width="570" height="74" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
<text x="1075.0" y="750.0" class="body center" >原 o_proj → 残差、归一化与 MLP</text>
<path d="M365 780 V834" class="line arrow"/>
<path d="M1075 780 V834" class="line arrow"/>
<text x="40" y="815" class="small strong" >进入下一层</text>
<rect x="80" y="844" width="570" height="82" rx="12" fill="#e7f6f1" stroke="#7dc8b4" stroke-width="1.5" />
<text x="365.0" y="893.0" class="body center" >第 15 层输入 → 计算新的 Q_A</text>
<rect x="790" y="844" width="570" height="82" rx="12" fill="#f2ecff" stroke="#bba1e7" stroke-width="1.5" />
<text x="1075.0" y="893.0" class="body center" >第 15 层输入 → 计算新的 Q_D-one</text>
<text x="720" y="876" class="small center amber strong" >Q 已不同</text>
<path d="M651 899 H780" class="line"/>
<rect x="32" y="957" width="1376" height="117" rx="12" fill="#f8fafc" stroke="#dce3ec" stroke-width="1.5" />
<text x="54" y="991" class="note" >“已不同”指 4 份旧开发资料的平均差异非零；全层 D 从第 1 层读出、第 2 层 Q 起改变。</text>
<text x="54" y="1022" class="note" >本层读出不会倒流改写已计算的本层 K/V。图没有定位某道错题，也不表示所有位置的缓存都同时改变。</text>
<text x="54" y="1053" class="note" >后续 16 个控制 token 继续保持相同输入，固定的是 token，不是各方法计算出的 Q/K/V。</text>
</svg>
