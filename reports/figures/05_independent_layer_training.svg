<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
  <title id="title">图 5-1｜训练下一层时，仍由完整模型提供特征</title>
  <desc id="desc">图 5-1。同一批48份训练和16份旧开发资料由冻结完整模型处理。针对当前目标层提取Q/K/V，训练本层Wq/Wk50轮，冻结后局部评测，保存本层参数指标并释放临时特征，再改为提取下一层。27层新训练，第14层复用。每一层的特征来自完整路径，不由前一层稀疏输出提供；32份新最终测试资料不参与此过程。</desc>
  <metadata>Source: bench/g3b_train.py::main; src/attention_lab/g3b.py::train_layer,evaluate_layer; src/attention_lab/g3a.py::extract_features. Static teaching schematic. No new model run. Box sizes do not encode time, token count, or vector size.</metadata>
  <defs>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #14243a; }
      .title { font-size:32px; font-weight:650; }
      .heading { font-size:26px; font-weight:650; }
      .body { font-size:22px; }
      .small { font-size:20px; }
      .note { font-size:20px; fill:#475569; }
      .strong { font-weight:650; }
      .center { text-anchor:middle; }
      .teal { fill:#0f766e; }
      .violet { fill:#6d28d9; }
      .blue { fill:#1d4ed8; }
      .amber { fill:#92400e; }
      .line { fill:none; stroke:#64748b; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
      .arrow { marker-end:url(#arrow); }
      .gradient { fill:none; stroke:#b45309; stroke-width:3; stroke-dasharray:8 6; marker-end:url(#gradient-arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
    <marker id="gradient-arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
  </defs>
  <rect width="1440" height="1020" rx="20" fill="#fff"/>
<text x="38" y="52" class="title" >图 5-1｜训练下一层时，仍由完整模型提供特征</text>
<text x="40" y="91" class="note" >G3b-lite 的处理次序 · 各层的索引参数分别训练，训练好的前层暂不接入模型</text>
<rect x="40" y="124" width="1360" height="66" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
<text x="720.0" y="165.0" class="body center" >重复使用 48 份训练资料 ＋ 16 份旧开发资料；另留的 32 份新最终测试资料此时不用。</text>
<rect x="40" y="220" width="400" height="480" rx="12" fill="#f7fafc" stroke="#cbd5e1" stroke-width="1.5" />
<text x="240" y="260" class="heading center teal" >① 主体始终完整读取</text>
<rect x="75" y="295" width="330" height="75" rx="12" fill="#e7f6f1" stroke="#7dc8b4" stroke-width="1.5" />
<text x="240.0" y="326.5" class="small center" >当前目标层之前的层</text>
<text x="240.0" y="354.5" class="small center" >保持完整注意力</text>
<path d="M240 371 V410" class="line arrow"/>
<rect x="75" y="420" width="330" height="100" rx="12" fill="#e7f6f1" stroke="#7dc8b4" stroke-width="1.5" />
<text x="240.0" y="462.5" class="small center" >当前目标层也完整读取</text>
<text x="240.0" y="493.5" class="small center" >在这里提取 Q / K / V</text>
<path d="M240 521 V559" class="line arrow"/>
<rect x="75" y="569" width="330" height="75" rx="12" fill="#e7f6f1" stroke="#7dc8b4" stroke-width="1.5" />
<text x="240.0" y="600.5" class="small center" >当前目标层之后的层</text>
<text x="240.0" y="628.5" class="small center" >保持完整注意力</text>
<text x="240" y="679" class="small center strong" >28 层主体权重均冻结</text>
<path d="M406 470 H500" class="line arrow"/>
<rect x="510" y="400" width="350" height="142" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
<text x="685.0" y="448.0" class="small center" >保存本层的固定特征</text>
<text x="685.0" y="479.0" class="small center" >每份资料取 4 个查询</text>
<text x="685.0" y="510.0" class="small center" >及这些查询可读的历史 K/V</text>
<path d="M861 443 H910 V330 H955" class="line arrow"/>
<path d="M861 499 H910 V571 H955" class="line arrow"/>
<text x="1180" y="257" class="heading center violet" >② 只训练当前层的索引</text>
<rect x="965" y="280" width="435" height="120" rx="12" fill="#f2ecff" stroke="#bba1e7" stroke-width="1.5" />
<text x="1182.5" y="317.0" class="small center" >只用 48 份训练资料</text>
<text x="1182.5" y="348.0" class="small center" >更新本层 Wq / Wk，固定 50 轮</text>
<text x="1182.5" y="379.0" class="small center" >其他层索引不参与此项更新</text>
<path d="M1180 401 V501" class="line arrow"/>
<text x="1198" y="457" class="small violet" >冻结参数</text>
<rect x="965" y="511" width="435" height="120" rx="12" fill="#e7f6f1" stroke="#7dc8b4" stroke-width="1.5" />
<text x="1182.5" y="548.0" class="small center" >用相同特征做局部对照</text>
<text x="1182.5" y="579.0" class="small center" >C / 初始 D0 / 训练后 D / 教师选位 R</text>
<text x="1182.5" y="610.0" class="small center" >48 份训练与 16 份旧开发分别报告</text>
<path d="M1180 632 V708" class="line arrow"/>
<rect x="510" y="718" width="890" height="88" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
<text x="955.0" y="754.5" class="body center" >③ 保存本层参数和指标，释放临时特征</text>
<text x="955.0" y="785.5" class="body center" >然后换下一目标层，重新执行①②③</text>
<text x="40" y="855" class="body strong" >换下一目标层时，仍提取完整模型的特征，不使用已训练前层的稀疏读出。</text>
<rect x="40" y="880" width="205" height="62" rx="12" fill="#f2ecff" stroke="#bba1e7" stroke-width="1.5" />
<text x="142.5" y="919.0" class="small center" >第 1 层参数</text>
<rect x="265" y="880" width="205" height="62" rx="12" fill="#f2ecff" stroke="#bba1e7" stroke-width="1.5" />
<text x="367.5" y="919.0" class="small center" >第 2 层参数</text>
<rect x="490" y="880" width="95" height="62" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.5" />
<text x="537.5" y="919.0" class="small center" >…</text>
<rect x="605" y="880" width="330" height="62" rx="12" fill="#eaf2ff" stroke="#93b4ef" stroke-width="1.5" />
<text x="770.0" y="919.0" class="small center" >第 14 层：复用已审参数</text>
<rect x="955" y="880" width="95" height="62" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.5" />
<text x="1002.5" y="919.0" class="small center" >…</text>
<rect x="1070" y="880" width="330" height="62" rx="12" fill="#f2ecff" stroke="#bba1e7" stroke-width="1.5" />
<text x="1235.0" y="919.0" class="small center" >第 28 层参数</text>
<text x="720" y="986" class="note center" >27 层新训练 ＋ 第 14 层复用。此时的好成绩仍是局部结果；第六课才让少读输出进入后续层。</text>
</svg>
