<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">图 3-1｜资料缓存相同，问题开始后各方法走自己的计算</title>
  <desc id="desc">图 3-1。同一份2050 token资料前缀不含问题，完整Prefill后复制给A、B、C、D0。各方法独立输入相同35 token问题和模板，随后用自己的输出自由生成、更新自己的缓存。首个答案预测时合法历史2085，B读开头4和最近320；最近320由285个资料token和35个问题模板token组成，总读取324。区段宽度不按token数比例。</desc>
  <metadata>Source: bench/g2lite_quality.py::main; reports/g2lite_answers_mac_m4max.json; notebooks/03_what_is_lost_when_reading_less.ipynb. Static teaching schematic. No new model run. Box sizes do not encode time, token count, or vector size.</metadata>
