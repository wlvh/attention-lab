<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img" aria-labelledby="title desc">
  <title id="title">索引只选位置，主注意力仍读原来的 K/V</title>
  <desc id="desc">本层输入经过原投影与归一化后分成两路。主Q/K经RoPE，K与不旋转的V按原位置写入完整缓存。索引用RoPE前的Q/K：每组两个128维Q拼成256维，经Wq变成32维u，新K经Wk变成32维z并追加到历史索引表。u给候选z打分，top-k名单与首4近64位置合并，主注意力按名单取原128维K/V重新打分、softmax和加权V，随后继续原输出投影、残差和MLP。</desc>
  <metadata>Source: reports/provenance/g1b/qwen_wrap_at_formal_decode_run.py::LabAttention.forward; reports/provenance/g1b/decode_at_g1a_g1b_runs.py::sparse_decode_step_kernel. Static teaching schematic. No new model run. Box sizes do not encode time, token count, or vector size.</metadata>
  <defs>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #14243a; }
      .title { font-size:32px; font-weight:650; }
      .heading { font-size:26px; font-weight:650; }
      .body { font-size:22px; }
      .small { font-size:20px; }
      .note { font-size:20px; fill:#475569; }
      .strong { font-weight:650; }
      .center { text-anchor:middle; }
      .teal { fill:#0f766e; }
      .violet { fill:#6d28d9; }
      .blue { fill:#1d4ed8; }
      .amber { fill:#92400e; }
      .line { fill:none; stroke:#64748b; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
      .arrow { marker-end:url(#arrow); }
      .gradient { fill:none; stroke:#b45309; stroke-width:3; stroke-dasharray:8 6; marker-end:url(#gradient-arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
    <marker id="gradient-arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
  </defs>
  <rect width="1440" height="1180" rx="20" fill="#fff"/>
<text x="38" y="52" class="title" >索引只选位置，主注意力仍读原来的 K/V</text>
<text x="40" y="91" class="note" >Qwen3-0.6B 的某一层、一个新 token · 8 个 KV 组，每组服务 2 个查询头</text>
<rect x="390" y="122" width="660" height="70" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
<text x="720.0" y="165.0" class="body center" >当前 token：本层输入（1,024 维）</text>
<path d="M720 193 V222" class="line arrow"/>
<rect x="240" y="230" width="960" height="92" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
<text x="720.0" y="268.5" class="body center" >原 Q/K/V 投影；Q/K 各自做原归一化</text>
<text x="720.0" y="299.5" class="body center" >每个 KV 组：2 个 128 维 Q、1 个 128 维 K、1 个 128 维 V</text>
<path d="M450 323 V341 H50 V435 H59" class="line arrow"/>
<path d="M990 323 V341 H765 V435 H779" class="line arrow"/>
<text x="360" y="388" class="heading center teal" >主注意力用的向量</text>
<text x="1080" y="388" class="heading center violet" >索引分支 · 使用 RoPE 前 Q/K</text>
<rect x="60" y="414" width="600" height="94" rx="12" fill="#e7f6f1" stroke="#7dc8b4" stroke-width="1.5" />
<text x="360.0" y="453.5" class="body center" >Q / K 按原位置做 RoPE</text>
<text x="360.0" y="484.5" class="body center" >V 保持原投影结果，不做旋转</text>
<rect x="780" y="414" width="600" height="94" rx="12" fill="#f2ecff" stroke="#bba1e7" stroke-width="1.5" />
<text x="1080.0" y="453.5" class="small center" >本组 2 个 Q 拼成 256 维 → Wq → u：32 维</text>
<text x="1080.0" y="484.5" class="small center" >新 K：128 维 → Wk → z：32 维</text>
<path d="M360 509 V550" class="line arrow"/>
<text x="377" y="538" class="small" >新 K / V</text>
<rect x="60" y="560" width="600" height="94" rx="12" fill="#e7f6f1" stroke="#7dc8b4" stroke-width="1.5" />
<text x="360.0" y="599.5" class="small center" >新 K / V 按原位置写入本层缓存</text>
<text x="360.0" y="630.5" class="small center" >原历史 K / V 继续完整保存；每行仍为 128 维</text>
<path d="M1080 509 V550" class="line arrow"/>
<text x="1097" y="538" class="small" >新 z</text>
<rect x="780" y="560" width="600" height="94" rx="12" fill="#f2ecff" stroke="#bba1e7" stroke-width="1.5" />
<text x="1080.0" y="599.5" class="small center" >新 z 按同一原位置追加到索引表</text>
<text x="1080.0" y="630.5" class="small center" >表里每个位置存一个 32 维索引向量</text>
<path d="M1080 655 V700" class="line arrow"/>
<path d="M1381 461 H1410 V747 H1388" class="line arrow"/>
<text x="1396" y="693" class="small violet" text-anchor="end">u</text>
<rect x="780" y="710" width="600" height="82" rx="12" fill="#f2ecff" stroke="#bba1e7" stroke-width="1.5" />
<text x="1080.0" y="743.5" class="small center" >u 与候选历史 z 打分 → top-k</text>
<text x="1080.0" y="774.5" class="small center" >加上必读的首 4 个和最近 64 个原位置</text>
<path d="M61 462 H31 V841 H70 V861" class="line arrow"/>
<text x="45" y="694" class="small teal" >当前主 Q</text>
<path d="M360 655 V861" class="line arrow"/>
<text x="380" y="746" class="small teal" >完整 K/V 缓存</text>
<path d="M1080 793 V861" class="line arrow"/>
<text x="1100" y="835" class="small violet" >只传原位置名单</text>
<rect x="60" y="870" width="1320" height="94" rx="12" fill="#e7f6f1" stroke="#7dc8b4" stroke-width="1.5" />
<text x="720.0" y="909.5" class="body center" >D：按名单取完整 128 维 K/V → 用原主 Q/K 重新打分 → softmax → 加权入选 V</text>
<text x="720.0" y="940.5" class="body center" >A：直接对全部合法位置做主注意力</text>
<path d="M720 965 V995" class="line arrow"/>
<rect x="120" y="1004" width="1200" height="70" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
<text x="720.0" y="1047.0" class="small center" >16 个头各 128 维 → 拼成 2,048 维 → 原 o_proj 回到 1,024 维 → 残差与 MLP → 下一层</text>
<rect x="32" y="1094" width="1376" height="55" rx="12" fill="#f8fafc" stroke="#dce3ec" stroke-width="1.5" />
<text x="54" y="1128" class="note" >本课 D 的索引尚未训练。索引分数负责选位置，不作为 V 的加权系数；少读不等于删掉缓存。</text>
</svg>
