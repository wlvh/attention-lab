<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1220" viewBox="0 0 1440 1220" role="img" aria-labelledby="title desc">
  <title id="title">答题反馈自己的 token，计时输入预存的 token</title>
  <desc id="desc">质量实验从问题模板最后一步的预测开始，选择自己最高分token，遇EOS或64 token上限停止，否则将该token送回本方法产生下一次预测。成本实验事先保存A产生的32个控制token，所有方法依次输入同一串，不让本次预测决定下一次输入，EOS也不提前停。新缓存请求计时包含缓存分配、完整资料Prefill、问题模板与32次控制前向，模型加载在计时前。</desc>
  <metadata>Source: src/attention_lab/inference.py::question_forward,free_generate,fixed_greedy_tokens; bench/g4lite_quality_cost.py::main. Static teaching schematic. No new model run. Box sizes do not encode time, token count, or vector size.</metadata>
  <defs>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #14243a; }
      .title { font-size:32px; font-weight:650; }
      .heading { font-size:26px; font-weight:650; }
      .body { font-size:22px; }
      .small { font-size:20px; }
      .note { font-size:20px; fill:#475569; }
      .strong { font-weight:650; }
      .center { text-anchor:middle; }
      .teal { fill:#0f766e; }
      .violet { fill:#6d28d9; }
      .blue { fill:#1d4ed8; }
      .amber { fill:#92400e; }
      .line { fill:none; stroke:#64748b; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
      .arrow { marker-end:url(#arrow); }
      .gradient { fill:none; stroke:#b45309; stroke-width:3; stroke-dasharray:8 6; marker-end:url(#gradient-arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
    <marker id="gradient-arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
  </defs>
  <rect width="1440" height="1220" rx="20" fill="#fff"/>
<text x="38" y="52" class="title" >答题反馈自己的 token，计时输入预存的 token</text>
<text x="40" y="91" class="note" >两种循环分开运行 · 都先完整处理资料，再处理问题及模板；各方法始终维护自己的缓存</text>
<rect x="32" y="128" width="666" height="540" rx="12" fill="#f8fcfa" stroke="#b4d8ca" stroke-width="1.5" />
<rect x="742" y="128" width="666" height="540" rx="12" fill="#fcfaff" stroke="#d2c3ea" stroke-width="1.5" />
<text x="365" y="173" class="heading center teal" >质量：各方法自由回答</text>
<text x="1075" y="173" class="heading center violet" >成本：各方法做满相同 32 次前向</text>
<rect x="75" y="205" width="500" height="82" rx="12" fill="#e7f6f1" stroke="#7dc8b4" stroke-width="1.5" />
<text x="325.0" y="238.5" class="small center" >当前词表分数</text>
<text x="325.0" y="269.5" class="small center" >首次来自问题与模板的最后一步</text>
<path d="M325 288 V322" class="line arrow"/>
<rect x="75" y="332" width="500" height="82" rx="12" fill="#e7f6f1" stroke="#7dc8b4" stroke-width="1.5" />
<text x="325.0" y="365.5" class="small center" >选最高分 token，加入自己的回答</text>
<text x="325.0" y="396.5" class="small center" >EOS 或已到 64 个新 token：停止</text>
<path d="M325 415 V463" class="line arrow"/>
<text x="347" y="448" class="small teal" >否则</text>
<rect x="75" y="473" width="500" height="90" rx="12" fill="#e7f6f1" stroke="#7dc8b4" stroke-width="1.5" />
<text x="325.0" y="510.5" class="small center" >把刚选出的 token 送回本方法</text>
<text x="325.0" y="541.5" class="small center" >读取、追加自己的 K/V，算下次分数</text>
<path d="M576 518 H653 V246 H584" class="line arrow"/>
<text x="365" y="613" class="body center teal strong" >下一步输入由本方法的预测决定</text>
<text x="365" y="647" class="small center" >保存原回答；提取四位数后按冻结规则判分</text>
<rect x="785" y="205" width="500" height="82" rx="12" fill="#f2ecff" stroke="#bba1e7" stroke-width="1.5" />
<text x="1035.0" y="238.5" class="small center" >A 事先产生并保存 x₁、x₂、…、x₃₂</text>
<text x="1035.0" y="269.5" class="small center" >所有方法复用这同一串控制输入</text>
<path d="M1035 288 V322" class="line arrow"/>
<rect x="785" y="332" width="500" height="82" rx="12" fill="#f2ecff" stroke="#bba1e7" stroke-width="1.5" />
<text x="1035.0" y="365.5" class="small center" >取序列中下一个 token xᵢ</text>
<text x="1035.0" y="396.5" class="small center" >用本方法自己的缓存执行一次前向</text>
<path d="M1035 415 V463" class="line arrow"/>
<rect x="785" y="473" width="500" height="90" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
<text x="1035.0" y="510.5" class="small center" >得到本次词表分数</text>
<text x="1035.0" y="541.5" class="small center" >它不决定下一次输入；不作为答案评分</text>
<path d="M1286 374 H1358 V247 H1294" class="line arrow"/>
<text x="1343" y="441" class="small violet" text-anchor="end">i＋1</text>
<text x="1075" y="613" class="body center violet strong" >下一步输入仍从预存序列取</text>
<text x="1075" y="647" class="small center" >EOS 也不提前停；完成 32 个控制 token 的前向</text>
<text x="40" y="724" class="heading" >成本表的“新缓存请求”，计时覆盖下面四段</text>
<text x="40" y="761" class="note" >模型与分配器已常驻；下面框宽只表示流程，不代表耗时。</text>
<rect x="40" y="798" width="225" height="110" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
<text x="152.5" y="861.0" class="body center" >分配本次缓存</text>
<path d="M266 853 H304" class="line arrow"/>
<rect x="314" y="798" width="330" height="110" rx="12" fill="#e7f6f1" stroke="#7dc8b4" stroke-width="1.5" />
<text x="479.0" y="845.5" class="small center" >完整处理资料</text>
<text x="479.0" y="876.5" class="small center" >D / D0 还建立索引表</text>
<path d="M645 853 H683" class="line arrow"/>
<rect x="693" y="798" width="310" height="110" rx="12" fill="#eaf2ff" stroke="#93b4ef" stroke-width="1.5" />
<text x="848.0" y="845.5" class="small center" >处理问题＋模板</text>
<text x="848.0" y="876.5" class="small center" >完成后已有首个预测</text>
<path d="M1004 853 H1042" class="line arrow"/>
<rect x="1052" y="798" width="348" height="110" rx="12" fill="#f2ecff" stroke="#bba1e7" stroke-width="1.5" />
<text x="1226.0" y="845.5" class="small center" >再执行 32 次控制前向</text>
<text x="1226.0" y="876.5" class="small center" >这些预测不反馈为输入</text>
<path d="M40 921 V939 H1400 V921" class="line"/>
<text x="720" y="970" class="body center strong" >新缓存请求总时间 = 分配 ＋ 资料处理 ＋ 问题处理 ＋ 32 次控制前向</text>
<text x="720" y="1011" class="note center" >A-step 与少读方法逐 token 处理已知问题；A-best 把已知问题一次输入。随后控制序列相同。</text>
<rect x="32" y="1051" width="1376" height="117" rx="12" fill="#f8fafc" stroke="#dce3ec" stroke-width="1.5" />
<text x="54" y="1085" class="note" >“32 次前向”不是自然生成 32 个输出 token；质量实验中的提前结束不会被算作成本实验的加速。</text>
<text x="54" y="1116" class="note" >资源/预算检查、日志、判分和输入搬运在计时外；D / D0 的参数与缓存身份检查仍在前向计时内。</text>
<text x="54" y="1147" class="note" >图只说明执行与计时边界，没有把总耗时差异归因于某一个操作。</text>
</svg>
