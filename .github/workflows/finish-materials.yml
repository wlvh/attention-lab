name: Publish verified project materials
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finish-materials.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: finish-reviewed-materials
  cancel-in-progress: false
jobs:
  finish:
    if: github.repository == 'wlvh/attention-lab' && github.actor == 'wlvh'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: verified-upload-objects
          run-id: 38893560999
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/verified-objects
      - uses: actions/download-artifact@v4
        with:
          name: source-bases
          run-id: 38881545134
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/source-bases
      - name: Restore reviewed documents and original sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/restore_verified_prefix.py --objects /tmp/verified-objects --bases /tmp/source-bases --output /tmp/verified-materials
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          root = Path.cwd()
          source = Path('/tmp/verified-materials')
          for path in source.rglob('*'):
              if not path.is_file(): continue
              relative = path.relative_to(source)
              target = root / relative
              if target.exists() and str(relative) != 'README.md' and target.read_bytes() != path.read_bytes():
                  raise SystemExit('Refusing to replace unrelated file: ' + str(relative))
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, target)
          Path('reports').mkdir(exist_ok=True)
          shutil.copyfile('bootstrap_manifest.json', 'reports/initial_import_manifest.json')
          print('44 verified files restored. Historical originals were not rewritten.')
          PY
      - name: Execute the orientation notebook and render HTML
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'nbformat==5.10.4' 'nbclient==0.10.4' 'nbconvert==7.17.1' 'ipykernel==7.2.0'
          python -m jupyter nbconvert --execute --to notebook --inplace notebooks/00_orientation.ipynb --ExecutePreprocessor.timeout=120
          python -m jupyter nbconvert --to html notebooks/00_orientation.ipynb --output-dir reports
          python scripts/roofline.py --format json > reports/roofline_predictions.json
          python scripts/roofline.py --bw 716.8e9 --scan-scope all > reports/cuda_4080_assumption_table.md
      - name: Test and record actual bootstrap evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_sources.py | tee reports/source_checks.txt
          python -m unittest discover -s tests -v 2>&1 | tee reports/bootstrap_tests.txt
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import os, re
          tests = Path('reports/bootstrap_tests.txt').read_text()
          match = re.search(r'Ran (\d+) tests', tests)
          assert match and '\nOK\n' in tests
          count = int(match.group(1))
          stamp = datetime.now(timezone.utc).isoformat()
          Path('reports/bootstrap_validation.md').write_text(
              '# Bootstrap validation\n\n'
              f'UTC: {stamp}\n\n'
              f'Actual unittest result: {count} tests passed. '
              'Nine archived source files passed size and SHA-256 verification. '
              'The orientation notebook executed top-to-bottom in a fresh Python kernel and was exported to HTML.\n\n'
              'This run used a GitHub-hosted Linux CPU environment. It is not a Mac/MPS/CUDA benchmark, '
              'a Qwen integration test, or indexer training. HTML rendering was generated; visual review is recorded separately.\n\n'
              'Evidence: bootstrap_tests.txt, source_checks.txt, repository_checks.txt.\n', encoding='utf-8')
          Path('reports/public_publication.md').write_text(
              '# Public repository publication\n\n'
              'Target: wlvh/attention-lab, public main branch, explicitly selected by the owner.\n\n'
              'The first 14 known-good upload objects reconstructed 44 exact hash-verified files. '
              'The damaged tail was not accepted. Remaining scripts were submitted directly; '
              'derived reports were regenerated from those scripts and the recovered notebook. '
              'The original nine source files remain byte-identical. '
              'initial_import_manifest.json preserves the earlier expected file hashes; '
              'the root bootstrap_manifest.json records this reviewed, completed publication.\n\n'
              f'Validation workflow run: {os.environ["GITHUB_RUN_ID"]}. '
              'Successful publication must also be checked against remote main and its file tree. '
              'No model weights, credentials, Mac results, training, or GPU experiments were published.\n', encoding='utf-8')
          status = Path('PROJECT_STATUS.md').read_text()
          status = status.replace('PUBLIC_BOOTSTRAP / G0_NOT_RUN_ON_MAC', 'MATERIALS_PUBLISHED / G0_NOT_RUN_ON_MAC')
          status += '\n## 本轮发布检查\n\n' + f'{count}项启动工具测试通过，九个来源原件哈希一致，导读Notebook已在Linux CPU环境顺序重跑。'
          status += '完整文档与脚本已纳入本次提交；Mac环境预检、真实注意力实现与训练仍未执行。详见reports/public_publication.md。\n'
          Path('PROJECT_STATUS.md').write_text(status, encoding='utf-8')
          PY
          python scripts/check_repository.py | tee reports/repository_checks.txt
      - name: Refresh the reviewed publication manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          old = json.loads(Path('reports/initial_import_manifest.json').read_text())
          names = {row['path'] for row in old['files']}
          names.update(['scripts/restore_verified_prefix.py', 'reports/source_checks.txt', 'reports/initial_import_manifest.json'])
          missing = [name for name in names if not Path(name).is_file()]
          assert not missing, missing
          rows = []
          for name in sorted(names):
              data = Path(name).read_bytes()
              rows.append({'path': name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          document = {'schema_version': 1, 'kind': 'reviewed_publication', 'scope': 'Project files; workflow definitions are excluded',
                      'source_originals_manifest': 'docs/source_manifest.json', 'files': rows}
          Path('bootstrap_manifest.json').write_text(json.dumps(document, ensure_ascii=False, indent=2)+'\n')
          Path('/tmp/commit-paths.json').write_text(json.dumps(sorted(names | {'bootstrap_manifest.json'})))
          print('Publication file count:', len(rows)+1)
          PY
      - name: Commit and push only reviewed paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json, subprocess
          paths=json.load(open('/tmp/commit-paths.json'))
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git commit -m 'docs: publish complete verified Mac-first lab materials and tested scripts'
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          target = Path('/tmp/published-project-proof')
          for name in json.loads(Path('/tmp/commit-paths.json').read_text()):
              path=target/name; path.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(name,path)
          PY
      - name: Export verified project copy (no Git credentials)
        uses: actions/upload-artifact@v4
        with:
          name: published-project-proof
          path: /tmp/published-project-proof/
          include-hidden-files: true
          retention-days: 1
