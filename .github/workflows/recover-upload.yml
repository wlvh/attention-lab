name: Inspect detached upload objects (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-upload.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Export known uploaded objects for local verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          shas = '''7987018e676de397cce6ed34cfd7a435a54eeaf8
          95cd522cad773a2296c0ed4c34eeaa87aa655d42
          db8610f52702a8f75052163a28eebf28b251b681
          77de090bd0527b4276754278998dac03bf1141fe
          cf4326062affe3784d01fb78b944cc0298989180
          94f77db4ecf3d61848287259bbfd939e558194a4
          52a9cdcce0bf9ff89a7427ff4c4c1ecd4f6831e6
          f81fbd4ba0d9184eb270872c66f1c184b15b409a
          6ff392d5b77ea45f50a00567c0be1722b147f51e
          be6398e4ada7063041864bcaa43b6b5b9f002e4e
          2ef14784ec7cddc5746bcf884900cb9bd2443b15
          024651d854ddcc6491f33d89fad780a475949594
          d6e51ae8035f0801beffa20ef0a2b3d5714c2ed4
          86f3db9de984b2ee881edbcd9db22fbc4edc3455
          f717bb05516b002abd47512f23e71e6fcf222394
          c22bc2801c1f351d8e371d1a2cf0ce47197d6b8c'''.split()
          target = pathlib.Path('/tmp/upload-objects'); target.mkdir()
          for i, sha in enumerate(shas):
              url = 'https://api.github.com/repos/wlvh/attention-lab/git/blobs/' + sha
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  item = json.load(response)
              data = base64.b64decode(item['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              (target / f'{i:02d}-{sha}.b64').write_bytes(data)
              print(i, sha, len(data))
          print('Only existing objects exported. No repository files changed by the job.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-upload-objects
          path: /tmp/upload-objects/
          retention-days: 1
