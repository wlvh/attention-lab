name: Bootstrap integrity checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original sources
        run: python scripts/check_sources.py
      - name: Check links and Python syntax
        run: python scripts/check_repository.py
      - name: Verify archived benchmark provenance
        run: python scripts/check_provenance.py
      - name: Bootstrap tooling tests (no torch; attention tests are skipped here on purpose)
        run: python -m unittest discover -s tests -v
  cpu-contract-tests:
    # The attention contract tests need torch. This job installs the CPU wheel so they actually run on CI;
    # the MPS cases skip on Linux and are covered by the Mac runs recorded under reports/.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU torch and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - name: Run contract tests on CPU (fails if they are skipped)
        run: |
          python -m pytest -q tests -rs 2>&1 | tee pytest.log
          if grep -q "torch not installed" pytest.log; then echo "contract tests were skipped" && exit 1; fi
