name: Import reviewed project materials
on:
  push:
    branches: [main]
    paths: ['.bootstrap/READY.json']
permissions:
  contents: write
concurrency:
  group: initial-material-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'wlvh/attention-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and restore reviewed files
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, pathlib, tarfile
          root = pathlib.Path.cwd()
          ready = json.loads((root/'.bootstrap/READY.json').read_text())
          parts = []
          for item in ready['parts']:
              path = root / item['path']
              assert path.resolve().is_relative_to((root/'.bootstrap').resolve())
              data = path.read_bytes()
              assert hashlib.sha256(data).hexdigest() == item['sha256'], item['path']
              parts.append(data)
          packed = base64.b64decode(b''.join(parts), validate=True)
          assert hashlib.sha256(packed).hexdigest() == ready['payload_sha256']
          raw = lzma.decompress(packed, memlimit=256*1024*1024)
          assert len(raw) <= 5*1024*1024
          files = {}
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as archive:
              for item in archive:
                  path = pathlib.PurePosixPath(item.name)
                  assert item.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert '.git' not in path.parts and not item.name.startswith('.github/workflows/')
                  assert item.name not in files and item.size <= 2*1024*1024
                  files[item.name] = archive.extractfile(item).read()
          assert len(files) == ready['file_count']
          manifest = json.loads(files['bootstrap_manifest.json'])
          expected = {row['path']: row for row in manifest['files']}
          assert set(files) == set(expected) | {'bootstrap_manifest.json'}
          for name, row in expected.items():
              assert len(files[name]) == row['bytes']
              assert hashlib.sha256(files[name]).hexdigest() == row['sha256'], name
          for name, data in files.items():
              path = root/name
              assert path.resolve().is_relative_to(root)
              if path.exists() and name != 'README.md':
                  assert path.read_bytes() == data, f'Refusing to replace unrelated content: {name}'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          pathlib.Path('/tmp/attention-import-paths.json').write_text(json.dumps(sorted(files)))
          print(f'Verified and restored {len(files)} reviewed files. No model or GPU experiment was run.')
          PY
      - name: Check project sources and bootstrap tools
        run: |
          python3 scripts/check_sources.py
          python3 scripts/check_repository.py
          python3 -m unittest discover -s tests -v
      - name: Commit restored materials without overwriting concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json, subprocess
          paths=json.load(open('/tmp/attention-import-paths.json'))
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','rm','-r','--','.bootstrap'],check=True)
          PY
          git commit -m 'docs: import verified Mac-first lab materials and public handoff'
          git push origin HEAD:main
