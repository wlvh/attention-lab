name: Verify public textbook source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/source-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check only the supplied public textbook page
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib
          url='https://huaweidata.com/column/qkv-transformer-computation/'
          try:
              request=urllib.request.Request(url,headers={'User-Agent':'attention-lab-source-check'})
              with urllib.request.urlopen(request,timeout=30) as r:
                  data=r.read(2*1024*1024)
                  print('source:',r.url,'bytes:',len(data),'sha256:',hashlib.sha256(data).hexdigest())
                  print('exact_original_match:',hashlib.sha256(data).hexdigest()=='1f41eaa313e70f30934b49fc5f8b0a526af78077c12524ba9f0e94674bc0f241')
          except Exception as e:
              print('source_check_unavailable:',type(e).__name__,str(e))
          PY
