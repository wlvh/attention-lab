name: Verify public textbook source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/source-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare standard notebook renderer
        run: python3 -m pip install 'nbconvert==7.17.1' 'nbformat==5.10.4'
      - name: Snapshot supplied public source and standard renderer output
        run: |
          mkdir -p source-bases
          python3 - <<'PY'
          import urllib.request,hashlib,pathlib
          import nbformat
          from nbconvert import HTMLExporter
          root=pathlib.Path('source-bases')
          url='https://huaweidata.com/column/qkv-transformer-computation/'
          request=urllib.request.Request(url,headers={'User-Agent':'attention-lab-source-check'})
          with urllib.request.urlopen(request,timeout=40) as r:
              data=r.read(2*1024*1024)
          (root/'public-textbook.html').write_bytes(data)
          page,_=HTMLExporter().from_notebook_node(nbformat.v4.new_notebook())
          (root/'blank-notebook.html').write_text(page,encoding='utf-8')
          for p in root.iterdir():
              b=p.read_bytes()
              print(p.name,len(b),hashlib.sha256(b).hexdigest())
          PY
      - name: Retain snapshots for exact-byte import verification
        uses: actions/upload-artifact@v4
        with:
          name: source-bases
          path: source-bases/
          retention-days: 1
